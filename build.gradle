plugins {
    id 'net.neoforged.moddev' version '2.0.148'
    id 'maven-publish'
}

base { archivesName = "mirrorworld-neoforge-${project.minecraft_version}" }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
sourceSets.main.java.srcDir 'src/client/java'
sourceSets.main.resources.srcDir 'src/client/resources'
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
neoForge {
    version = project.neoforge_version
    addModdingDependenciesTo sourceSets.gametest
    mods {
        mirrorworld { sourceSet sourceSets.main }
        mirrorworld_test { sourceSet sourceSets.gametest }
    }
    runs {
        client { client(); gameDirectory = file('run/neoforge-client') }
        server { server(); gameDirectory = file('run/neoforge-server'); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            gameDirectory = file('build/run/neoforge-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'mirrorworld_test'
            loadedMods = [mods.mirrorworld, mods.mirrorworld_test]
        }
    }
    runs.client.loadedMods = [mods.mirrorworld]
    runs.server.loadedMods = [mods.mirrorworld]
}
tasks.named('check') { dependsOn 'runGameTestServer' }
processResources {
    def modVersion = project.version
    inputs.property 'version', modVersion
    filesMatching('META-INF/neoforge.mods.toml') { expand version: modVersion }
}
jar { from('LICENSE') { rename { 'LICENSE_mirrorworld' } } }
publishing { publications { mavenJava(MavenPublication) { from components.java } } }
