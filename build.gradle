plugins {
    id 'net.neoforged.moddev' version '2.0.148'
    id 'maven-publish'
}

base { archivesName = "mirrorworld-neoforge-${project.minecraft_version}" }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
sourceSets.main.java.srcDir 'src/client/java'
sourceSets.main.resources.srcDir 'src/client/resources'
neoForge {
    version = project.neoforge_version
    runs {
        client { client(); gameDirectory = file('run/neoforge-client') }
        server { server(); gameDirectory = file('run/neoforge-server'); programArgument '--nogui' }
    }
    mods { mirrorworld { sourceSet sourceSets.main } }
}
processResources {
    def metadata = [version: project.version, minecraft_version: project.minecraft_version,
                    neoforge_version: project.neoforge_version]
    inputs.properties metadata
    filesMatching('META-INF/neoforge.mods.toml') { expand metadata }
}
jar { from('LICENSE') { rename { 'LICENSE_mirrorworld' } } }
publishing { publications { mavenJava(MavenPublication) { from components.java } } }
